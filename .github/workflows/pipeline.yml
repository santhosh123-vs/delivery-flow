name: DeliveryFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Run quick pipeline
        run: |
          python -c "
          from src.delivery_flow.config import PipelineConfig
          from src.delivery_flow.pipeline import PipelineEngine
          config = PipelineConfig.from_yaml('pipelines/quick-test.yaml')
          engine = PipelineEngine(config)
          result = engine.run()
          assert result.status == 'passed'
          print('Pipeline test passed!')
          "
